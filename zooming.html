<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Zoom Effect</title>
    
    <style>
       
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.image-box {
    width: 400px;
    height: 280px;
    border-radius: 12px;
    overflow: hidden; 
}

.image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover; 
    transition: transform 5s ease-in-out; 
}


.image-box:hover img {
    transform: scale(5); 
}
 
    </style>
</head>
<body>


    <div class="gallery-container">
        
        <div class="image-box">
            <img src="https://t4.ftcdn.net/jpg/04/86/97/27/360_F_486972750_hQVbv6yRJ9e615Eo3qvnujq7abDrXFGi.jpg" alt="Sample Landscape">
        </div>

    </div>

</body>
</html>
