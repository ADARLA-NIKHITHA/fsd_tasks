<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <style>
        .card{
            background-color: blueviolet;
            height: 200px;
            width:200px;
        }
        .card:hover{
            transition: all 3s ease;
            background-color: aquamarine;
            height: 250px;
            width:250px;            
        }
    </style>
</head>
<body>
<div class="card">
    this is a card
</div>
</body>

</html>
