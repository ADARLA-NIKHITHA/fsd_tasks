<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ball</title>
    <style>
.container {
  width: 300px;
  height: 50px;
  border-bottom: 2px solid #ccc;
  position: relative;
}

.ball {
  width: 40px;
  height: 40px;
  background-color: #e74c3c;
  border-radius: 50%;
  position: absolute;
  
  animation-name: moveBall;
  animation-duration: 2s;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}

@keyframes moveBall {
  0%   { left: 0%; }
  50%  { left: calc(100% - 40px); } 
  100% { left: 0%; }
}

    </style>
</head>
<body>
    <div class="container">
  <div class="ball"></div>
</div>

</body>
</html>
